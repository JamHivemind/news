name: Seiten bauen
on:
  push:
    paths: ['site.json', '**/content.json', '**/config.json', '**/data/zonen.json', 'template.html', 'scripts/**', 'assets/**']
  schedule:
    # Feeds vor dem Morgenlauf der Routine holen (Routine 06:15 Berlin im Winter). GitHub startet geplante Läufe oft 1-2 Stunden später,
    # daher zwei Läufe mit viel Vorlauf (02:30 und 04:00 Berlin). Die Cloud-Umgebung der Routine erreicht die Nachrichtenseiten nicht, GitHub schon.
    - cron: '30 1 * * *'
    - cron: '0 3 * * *'
    # Kennzahlen nachziehen (08:30 und 10:20 Berlin im Winter)
    - cron: '30 7 * * *'
    - cron: '20 9 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # immer den neuesten Stand bauen, nicht den Stand beim Auslösen (sonst Konflikte, wenn mehrere Läufe hintereinander warten)
          ref: main

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Feeds holen (für die Routine)
        run: node scripts/feeds.mjs

      - name: Kennzahlen holen (EZB, Börse, arXiv, Hugging Face, Fußball)
        run: node scripts/metrics.mjs

      - name: Marktdaten Modelle im Blick (höchstens 1x pro Woche, abschaltbar über modelle.abruf)
        run: node scripts/markt.mjs
        continue-on-error: true

      - name: Alle Dashboards und Startseite bauen
        run: node scripts/build.mjs

      - name: Commit und Push
        run: |
          git config user.name "news[bot]"
          git config user.email "news[bot]@users.noreply.github.com"
          commit() { git add -A; git diff --cached --quiet && return 1; git commit -q -m "seiten: $(date -u +%Y-%m-%d)"; }
          commit || exit 0
          # GitHub lehnt Pushes gelegentlich ab (Fehler oder neuer Stand): bis zu 5 Versuche.
          # Gibt es beim Zusammenführen einen Konflikt in erzeugten Dateien, auf den neuesten Stand setzen und neu bauen.
          for i in 1 2 3 4 5; do
            git push origin HEAD:main && exit 0
            sleep $((i * 15))
            git fetch -q origin main
            if ! git rebase -q origin/main; then
              git rebase --abort
              git reset -q --hard origin/main
              node scripts/build.mjs
              commit || exit 0
            fi
          done
          exit 1
