# Sucht mit TruffleHog nach versehentlich committeten Secrets (API-Keys, Tokens).
# - push / pull_request: prüft nur die neuen Commits
# - wöchentlich (Mo 04:17 UTC) + manuell: prüft die komplette Git-Historie
# Bei einem Fund schlägt der Lauf fehl -> GitHub schickt eine Mail.
# Ein gefundener Key ist verbrannt: rotieren, nicht nur löschen.
name: Secret Scan

on:
  push:
  pull_request:
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trufflehog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: TruffleHog
        uses: trufflesecurity/trufflehog@v3.90.0
        with:
          extra_args: --results=verified,unknown
